name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/adam/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - name: Build with local database
        env:
          LOCAL_DATABASE_URL: file:./data/ci-dear-creative.db
        run: |
          npm run db:migrate:local
          npx next build
      - name: Build without database env or local DB file
        run: |
          rm -f data/dear-creative.db data/ci-dear-creative.db
          env -u TURSO_DATABASE_URL -u TURSO_AUTH_TOKEN -u LOCAL_DATABASE_URL npx next build
      - name: Adam ADK service
        working-directory: services/adam
        run: |
          npm ci
          npm test
          npm run build
          npm run build:agent
          npm run build:prod
      - name: Adam GCP scripts require project id
        run: ./scripts/gcp/adam-gcp-require-project.test.sh
      - name: Adam GCP image digest validation
        run: ./scripts/gcp/adam-gcp-image-ref.test.sh
      - name: Adam prod image boot proof
        env:
          GCP_PROJECT_ID: ci-boot-proof-local
        run: ./scripts/gcp/adam-docker-boot-proof.sh
